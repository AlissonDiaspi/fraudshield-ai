
services:
  
  # POSTGRESQL
  
  postgres:
    image: postgres:16-alpine
    container_name: fraudshield-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - fraudshield_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5

  
  # APACHE KAFKA
  
  kafka:
    image: apache/kafka:4.1.0
    container_name: fraudshield-kafka
    restart: unless-stopped

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"

      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://127.0.0.1:9092,INTERNAL://kafka:29092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    volumes:
      - fraudshield_kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-broker-api-versions.sh
        - --bootstrap-server
        - localhost:9092
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  
  # PROMETHEUS
  
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: fraudshield-prometheus
    restart: unless-stopped

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - fraudshield_prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost:9090/-/healthy
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  
  # GRAFANA
  
  grafana:
    image: grafana/grafana:12.1.1
    container_name: fraudshield-grafana
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - fraudshield_grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      prometheus:
        condition: service_started

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:3000/api/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  
  # MLFLOW
  
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow

    container_name: fraudshield-mlflow
    restart: unless-stopped

    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlflow-artifacts:/app/mlflow-artifacts

    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////app/mlflow.db
      - --artifacts-destination
      - /app/mlflow-artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000

  
  # FASTAPI
  
  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: fraudshield-api
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MLFLOW_TRACKING_URI: http://mlflow:5000

    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

    command:
      - uvicorn
      - fraudshield.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

      
  
  # NEXT.JS FRONTEND
  
  web:
    build:
      context: .
      dockerfile: Dockerfile.web

    container_name: fraudshield-web
    restart: unless-stopped

    ports:
      - "127.0.0.1:3001:3000"

    environment:
      NODE_ENV: production
      API_URL: http://api:8000

    depends_on:
      api:
        condition: service_started



# VOLUMES PERSISTENTES

volumes:
  fraudshield_postgres_data:
  fraudshield_kafka_data:
  fraudshield_prometheus_data:
  fraudshield_grafana_data:
