
# ==========================================
# FRAUDSHIELD AI - PROMETHEUS
# ==========================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  # ========================================
  # FRAUDSHIELD CONSUMER
  # ========================================
  - job_name: "fraudshield-consumer"

    metrics_path: /metrics

    static_configs:
      - targets:
          - "host.docker.internal:8001"

        labels:
          application: "fraudshield-ai"
          component: "consumer"

  # ========================================
  # PROMETHEUS - SELF MONITORING
  # ========================================
  - job_name: "prometheus"

    metrics_path: /metrics

    static_configs:
      - targets:
          - "localhost:9090"

        labels:
          application: "fraudshield-ai"
          component: "monitoring"
