
services:
  mlflow-bootstrap-test:
    build:
      context: .
      dockerfile: Dockerfile.mlflow

    container_name: fraudshield-mlflow-bootstrap-test

    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////app/test-data/mlflow.db
      - --artifacts-destination
      - /app/test-data/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - localhost,localhost:5001,127.0.0.1,127.0.0.1:5001

    ports:
      - "127.0.0.1:5001:5000"

    volumes:
      - fraudshield_bootstrap_test_data:/app/test-data

volumes:
  fraudshield_bootstrap_test_data:
